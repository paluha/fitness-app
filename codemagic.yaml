# Облачная сборка iOS → TestFlight через Codemagic (у нас нет своего Mac).
#
# Подключение (делается ОДИН раз в codemagic.io):
#   1. codemagic.io → Add application → выбрать этот GitHub-репо (paluha/fitness-app).
#   2. Teams → Integrations → App Store Connect → добавить API-ключ:
#      App Store Connect → Users and Access → Integrations (Keys) → создать ключ
#      с ролью «App Manager», скачать .p8, вписать Issuer ID + Key ID + файл.
#      Назвать интеграцию: trainx-asc
#   3. В App Store Connect уже создано приложение «TrainX Fitness Tracker»
#      с bundle id club.trainx.app — впиши его Apple ID (число из URL/App
#      Information) в APP_STORE_APPLE_ID ниже вместо REPLACE_ME.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: trainx-asc
    environment:
      vars:
        BUNDLE_ID: club.trainx.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "REPLACE_ME" # Apple ID приложения в App Store Connect (число)
      node: 20.19.0
      xcode: latest
    scripts:
      - name: Зависимости
        script: npm ci
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Подпись (сертификаты и профили из App Store Connect)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Сборка ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
