# Облачная сборка iOS → TestFlight через Codemagic (у нас нет своего Mac).
#
# Подключение (делается ОДИН раз в codemagic.io):
#   1. codemagic.io → Add application → выбрать этот GitHub-репо (paluha/fitness-app).
#   2. App Store Connect API-ключ ПЕРЕИСПОЛЬЗУЕМ от mypinpoint — интеграция
#      mypinpoint-asc уже есть в Codemagic (один ключ работает для всех
#      приложений аккаунта). Ничего создавать не надо.
#   3. Приложение «TrainX Fitness Tracker» (bundle id club.trainx.app,
#      Apple ID 6758902889) уже создано в App Store Connect.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: mypinpoint-asc
    environment:
      vars:
        BUNDLE_ID: club.trainx.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6758902889" # Apple ID приложения TrainX в App Store Connect
      node: 20.19.0
      xcode: latest
    scripts:
      - name: Зависимости
        script: npm ci
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Подпись (сертификаты и профили из App Store Connect)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Сборка ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
